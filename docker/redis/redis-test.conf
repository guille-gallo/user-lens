# Test Redis Configuration
# Optimized for testing - fast, no persistence

# Network
bind 0.0.0.0
port 6379
protected-mode no

# No Persistence (faster for tests)
save ""
appendonly no

# Memory Management
maxmemory 128mb
maxmemory-policy allkeys-lru

# Logging
loglevel warning
logfile ""

# Performance
tcp-keepalive 60
timeout 0

# Database
databases 16

# Test-specific settings
notify-keyspace-events ""

# Client Output Buffer Limits (smaller for tests)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 32mb 8mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
