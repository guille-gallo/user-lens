services:
  # Main Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
      - "5173:5173"
    environment:
      - NODE_ENV=development
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
      - logs:/app/logs
    depends_on:
      - redis-dev
      - redis-test
    networks:
      - user-lens-network
    command: npm run dev:docker

  # Development Redis (Primary)
  redis-dev:
    image: redis:7-alpine
    container_name: user-lens-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
      - ./docker/redis/redis-dev.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - user-lens-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Test Redis (For running tests)
  redis-test:
    image: redis:7-alpine
    container_name: user-lens-redis-test
    ports:
      - "6380:6379"
    volumes:
      - ./docker/redis/redis-test.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - user-lens-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cluster Simulation (for testing cluster scenarios)
  redis-cluster:
    image: redis:7-alpine
    container_name: user-lens-redis-cluster
    ports:
      - "7000-7005:7000-7005"
    volumes:
      - ./docker/redis-cluster:/etc/redis
      - redis_cluster_data:/data
    command: /etc/redis/cluster-init.sh
    networks:
      - user-lens-network
    depends_on:
      - redis-dev

  # Database Seeder Service
  db-seeder:
    build:
      context: .
      dockerfile: Dockerfile.seeder
    env_file:
      - .env.development
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    depends_on:
      - redis-dev
    networks:
      - user-lens-network
    profiles:
      - seeding

  # Redis Commander (Database GUI)
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: user-lens-redis-gui
    environment:
      - REDIS_HOSTS=local:redis-dev:6379,test:redis-test:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis-dev
      - redis-test
    networks:
      - user-lens-network
    profiles:
      - tools

  # Nginx (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: user-lens-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - user-lens-network
    profiles:
      - production-like

volumes:
  redis_dev_data:
    driver: local
  redis_cluster_data:
    driver: local
  logs:
    driver: local

networks:
  user-lens-network:
    driver: bridge
